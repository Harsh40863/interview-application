name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || 'https://ai-mock-interviewer-backend.onrender.com' }}"
          echo "Pinging ${BACKEND_URL}/health..."
          curl -s -f "${BACKEND_URL}/health" || echo "Backend ping completed"
