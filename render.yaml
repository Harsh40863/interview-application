services:
  - type: web
    name: ai-mock-interviewer-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: USE_MOCK_LLM
        value: "false"
      - key: FRONTEND_URL
        value: https://ai-mock-interviewer.pages.dev
